<!DOCTYPE html>
<html>
<head>
    <title>Teja Digitals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #0f0f18; color: white; min-height: 100vh; }
        header { background: linear-gradient(135deg, #1a1a2e, #2d2d4a); padding: 25px 20px; text-align: center; box-shadow: 0 2px 15px rgba(0,0,0,.4); }
        header h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
        header .brand { font-size: 12px; color: #ffd700; margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 15px; }
        .grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform .2s; }
        .grid img:hover { transform: scale(1.03); }
        .empty { text-align: center; padding: 60px 20px; color: #888; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.96); justify-content: center; align-items: center; flex-direction: column; z-index: 99; overflow: hidden; }
        #overlay img { max-width: 94%; max-height: 78%; border-radius: 6px; touch-action: pinch-zoom; cursor: zoom-in; transition: transform .1s ease; }
        #downloadBtn { margin-top: 18px; padding: 12px 30px; background: #4CAF50; color: white; text-decoration: none; border-radius: 30px; font-weight: 600; }
        #closeBtn { position: absolute; top: 15px; right: 22px; color: white; font-size: 38px; cursor: pointer; line-height: 1; z-index: 100; }
        .hint { color: #888; font-size: 12px; margin-top: 8px; }
        footer { text-align: center; padding: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h1 id="eventTitle">Gallery</h1>
    <div class="brand">Teja Digitals</div>
</header>

<div class="grid" id="photo-container"></div>
<div class="empty" id="emptyMsg">Loading photos...</div>

<div id="overlay">
    <span id="closeBtn">&times;</span>
    <img id="bigPhoto" src="">
    <p class="hint">Scroll / Pinch to zoom · Double-click to reset</p>
    <a id="downloadBtn" href="" download>⬇ Download</a>
</div>

<footer>📸 Teja Digitals · 9652132136</footer>

<script>
    const params = new URLSearchParams(window.location.search);
    const event = params.get("event");
    document.getElementById("eventTitle").innerText = event ? event.replace(/-/g, " ").toUpperCase() : "GALLERY";

    async function loadPhotos() {
        if (!event) {
            document.getElementById("emptyMsg").innerText = "No event selected.";
            return;
        }
        try {
            const res = await fetch("/list/" + event);
            const data = await res.json();

            const container = document.getElementById("photo-container");
            container.innerHTML = "";
            data.photos.forEach(filename => {
                const url = "/photos/" + event + "/" + encodeURIComponent(filename);
                const img = document.createElement("img");
                img.src = url;
                img.loading = "lazy";
                img.onclick = () => openPhoto(url, filename);
                container.appendChild(img);
            });
            document.getElementById("emptyMsg").style.display = data.photos.length ? "none" : "block";
            if (!data.photos.length) document.getElementById("emptyMsg").innerText = "No photos yet. Please check back soon.";
        } catch (e) {}
    }

    let zoomScale = 1;
    const bigPhotoEl = document.getElementById("bigPhoto");

    function openPhoto(url, filename) {
        zoomScale = 1;
        bigPhotoEl.style.transform = "scale(1)";
        bigPhotoEl.src = url;
        const btn = document.getElementById("downloadBtn");
        btn.href = url;
        btn.download = filename;
        document.getElementById("overlay").style.display = "flex";
    }

    bigPhotoEl.addEventListener("wheel", (e) => {
        e.preventDefault();
        zoomScale += e.deltaY * -0.0015;
        zoomScale = Math.min(Math.max(1, zoomScale), 4);
        bigPhotoEl.style.transform = "scale(" + zoomScale + ")";
    });

    bigPhotoEl.addEventListener("dblclick", () => {
        zoomScale = zoomScale > 1 ? 1 : 2;
        bigPhotoEl.style.transform = "scale(" + zoomScale + ")";
    });

    document.getElementById("closeBtn").onclick = () => {
        document.getElementById("overlay").style.display = "none";
    };

    loadPhotos();
    setInterval(loadPhotos, 4000);
</script>

</body>
</html>
