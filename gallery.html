<!DOCTYPE html>
<html>
<head>
    <title>Teja digitals</title>
    <style>
        body { font-family: Arial; text-align: center; }
        #photo-container { display: flex; flex-wrap: wrap; justify-content: center; }
        .thumb { width: 200px; margin: 10px; cursor: pointer; border-radius: 8px; }
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #overlay img { max-width: 90%; max-height: 80%; }
        #overlay a {
            margin-top: 15px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        #closeBtn {
            position: absolute;
            top: 20px; right: 30px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Teja digitals</h2>
    <div id="photo-container"></div>

    <div id="overlay">
        <span id="closeBtn">&times;</span>
        <img id="bigPhoto" src="">
        <a id="downloadBtn" href="" download>Download Photo</a>
    </div>

    <script>
        async function loadPhotos() {
            const response = await fetch("/list");
            const data = await response.json();
            const container = document.getElementById("photo-container");
            container.innerHTML = "";
            data.photos.forEach(filename => {
                const url = "/photos/" + filename;
                const img = document.createElement("img");
                img.src = url;
                img.className = "thumb";
                img.onclick = () => openPhoto(url, filename);
                container.appendChild(img);
            });
        }
        function openPhoto(url, filename) {
            document.getElementById("bigPhoto").src = url;
            document.getElementById("downloadBtn").href = url;
            document.getElementById("downloadBtn").download = filename;
            document.getElementById("overlay").style.display = "flex";
        }
        document.getElementById("closeBtn").onclick = () => {
            document.getElementById("overlay").style.display = "none";
        };
        loadPhotos();
        setInterval(loadPhotos, 3000);
    </script>
</body>
</html>
