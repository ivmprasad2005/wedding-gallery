<!DOCTYPE html>
<html>
<head>
    <title>Teja Digitals — Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .card { max-width: 700px; margin: 0 auto 20px; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a1a2e; margin: 0 0 5px; font-size: 24px; }
        .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 25px; }
        .event-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .event-name { font-weight: 600; color: #1a1a2e; text-transform: capitalize; }
        .btn { background: #1a1a2e; color: white; border: none; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; margin-left: 6px; cursor: pointer; }
        .btn-view { background: #4CAF50; }
        .btn-del { background: #e53935; }
        .newBtn { display: block; text-align: center; background: #1a1a2e; color: white; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 10px; }
        .empty { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>తేజా స్టూడియో</h1>
    <div class="sub">All Events Dashboard</div>
    <a class="newBtn" href="/uploads.html">+ Create / Upload New Event</a>
</div>

<div class="card">
    <label style="font-weight:600;">All Events</label>
    <div id="eventList" style="margin-top:15px;"></div>
</div>

<script>
    async function loadEvents() {
        const res = await fetch("/events");
        const data = await res.json();
        const container = document.getElementById("eventList");
        container.innerHTML = "";
        if (data.events.length === 0) {
            container.innerHTML = "<div class='empty'>No events yet. Create one above.</div>";
            return;
        }
        data.events.forEach(name => {
            const div = document.createElement("div");
            div.className = "event-item";
            div.innerHTML = `
                <span class="event-name">${name.replace(/-/g, " ")}</span>
                <span>
                    <a class="btn" href="/uploads.html?event=${name}">Manage</a>
                    <a class="btn btn-view" href="/gallery.html?event=${name}" target="_blank">View</a>
                    <button class="btn btn-del" onclick="deleteEvent('${name}')">Delete</button>
                </span>
            `;
            container.appendChild(div);
        });
    }

    async function deleteEvent(name) {
        if (!confirm(`Delete entire event "${name}" and all its photos? This cannot be undone.`)) return;
        await fetch("/delete-event/" + name, { method: "DELETE" });
        loadEvents();
    }

    loadEvents();
</script>

</body>
</html>
